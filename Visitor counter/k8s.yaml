apiVersion: v1
kind: ConfigMap
metadata:
  name: visitor-config
  labels:
    app: visitor-counter
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  STUDENT_NAME: "Bhuwan Kumar"
  STUDENT_ROLL: "2410030358"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: visitor-counter
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visitor-counter
      tier: backend
  template:
    metadata:
      labels:
        app: visitor-counter
        tier: backend
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: visitor-counter
    tier: backend
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: visitor-counter
    tier: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  labels:
    app: visitor-counter
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-counter
      tier: frontend
  template:
    metadata:
      labels:
        app: visitor-counter
        tier: frontend
    spec:
      containers:
      - name: flask-app
        image: flask-visitor-counter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: visitor-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  labels:
    app: visitor-counter
    tier: frontend
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
  selector:
    app: visitor-counter
    tier: frontend
