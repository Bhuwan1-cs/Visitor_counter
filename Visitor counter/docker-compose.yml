services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-visitor-counter
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STUDENT_NAME=Bhuwan Kumar
      - STUDENT_ROLL=2410030358
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
