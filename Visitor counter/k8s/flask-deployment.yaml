apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  labels:
    app: visitor-counter
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-counter
      tier: frontend
  template:
    metadata:
      labels:
        app: visitor-counter
        tier: frontend
    spec:
      containers:
      - name: flask-app
        image: flask-visitor-counter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: visitor-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
