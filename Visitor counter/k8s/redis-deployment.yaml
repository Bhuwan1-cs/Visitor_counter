apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: visitor-counter
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visitor-counter
      tier: backend
  template:
    metadata:
      labels:
        app: visitor-counter
        tier: backend
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
