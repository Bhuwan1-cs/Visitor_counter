events {
    worker_connections 1024;
}

http {
    upstream backend_visitor_service {
        # Primary Site: Local / On-Premise Kubernetes NodePort Service
        server 127.0.0.1:30080 max_fails=1 fail_timeout=2s;
        
        # Standby Secondary Site: Cloud Disaster Recovery Instance
        server 127.0.0.1:5001 backup;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://backend_visitor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Failover Configuration: Re-route on error/timeout/502/503/504 instantly
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location /health {
            proxy_pass http://backend_visitor_service/health;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
